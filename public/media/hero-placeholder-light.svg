<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
	<defs>
		<linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#f4f7ff" />
			<stop offset="100%" stop-color="#eef1ff" />
		</linearGradient>
		<radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
			<stop offset="100%" stop-color="#93c5fd" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.75" />
			<stop offset="100%" stop-color="#c4b5fd" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#67e8f9" stop-opacity="0.5" />
			<stop offset="100%" stop-color="#67e8f9" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.35" />
			<stop offset="100%" stop-color="#f9a8d4" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
			<stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
		</radialGradient>
		<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
			<path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1e293b" stroke-opacity="0.035" stroke-width="1" />
		</pattern>
		<filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="80" />
		</filter>
	</defs>

	<rect width="1920" height="1080" fill="url(#base)" />
	<rect width="1920" height="1080" fill="url(#grid)" />

	<g filter="url(#soften)">
		<circle cx="380" cy="240" r="420" fill="url(#blobBlue)" />
		<circle cx="1560" cy="260" r="480" fill="url(#blobViolet)" />
		<circle cx="960" cy="1040" r="560" fill="url(#blobCyan)" />
		<circle cx="1150" cy="700" r="380" fill="url(#blobPink)" />
	</g>

	<rect width="1920" height="1080" fill="url(#vignette)" />
</svg>
